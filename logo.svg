<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120">
  <defs>
    <linearGradient id="flame-outer" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#d08770"/>
      <stop offset="50%" stop-color="#bf616a"/>
      <stop offset="100%" stop-color="#ebcb8b"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#ebcb8b"/>
      <stop offset="100%" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="base-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4c566a"/>
      <stop offset="100%" stop-color="#3b4252"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#88c0d0"/>
      <stop offset="100%" stop-color="#81a1c1"/>
    </linearGradient>
  </defs>

  <!-- Flame icon scaled to fit -->
  <g transform="translate(50, 60) scale(0.28)">
    <!-- Kindling sticks -->
    <g transform="translate(0, 124)">
      <rect x="-120" y="-12" width="240" height="24" rx="6" fill="url(#base-grad)" transform="rotate(-18)"/>
      <rect x="-120" y="-12" width="240" height="24" rx="6" fill="url(#base-grad)" transform="rotate(18)"/>
    </g>
    <!-- Outer flame -->
    <path d="M0-184 C-20-124,-76-84,-92-36 C-112 20,-104 76,-76 116 C-52 148,-24 164,0 168 C24 164,52 148,76 116 C104 76,112 20,92-36 C76-84,20-124,0-184 Z" fill="url(#flame-outer)"/>
    <!-- Mid flame -->
    <path d="M0-104 C-12-64,-48-32,-60 8 C-72 48,-60 84,-36 112 C-20 128,-8 132,0 132 C8 132,20 128,36 112 C60 84,72 48,60 8 C48-32,12-64,0-104 Z" fill="#d08770" opacity="0.85"/>
    <!-- Inner flame -->
    <path d="M0-28 C-8 0,-32 24,-36 52 C-40 76,-28 100,-8 112 C-4 114,0 114,4 114 C8 114,20 106,28 88 C40 60,36 28,24 4 C16-12,8-20,0-28 Z" fill="url(#flame-inner)" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="110" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="url(#text-grad)">KINDLING</text>
</svg>
